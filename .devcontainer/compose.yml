services:
  workspace:
    image: pilotswarm-dev-source:local
    init: true
    command: ["sleep", "infinity"]
    labels:
      io.pilotswarm.devcontainer: "source"
    depends_on:
      test-db:
        condition: service_healthy
      portal-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    shm_size: "1gb"
    volumes:
      - type: bind
        source: ..
        target: /workspaces/PilotSwarm
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: npm-cache
        target: /home/vscode/.npm
      - type: volume
        source: nx-cache
        target: /workspaces/PilotSwarm/.nx
      - type: volume
        source: vscode-profile
        target: /home/vscode/.vscode-server
      - type: volume
        source: local-workspaces
        target: /home/vscode/pilotswarm-local
    environment:
      PILOTSWARM_DEVCONTAINER: "1"
      NX_DAEMON: "false"
    healthcheck:
      test: ["CMD", "runuser", "-u", "vscode", "--", "node", "-e", "process.exit(process.getuid() === 0 ? 1 : 0)"]
      interval: 10s
      timeout: 5s
      retries: 6
  test-db:
    image: postgres:17.6-bookworm
    command: ["postgres", "-c", "max_connections=1500"]
    shm_size: "1gb"
    labels:
      io.pilotswarm.devcontainer: "source"
    environment:
      POSTGRES_USER: pilotswarm
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: pilotswarm_test
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotswarm -d pilotswarm_test"]
      interval: 5s
      timeout: 5s
      retries: 30
  portal-db:
    image: postgres:17.6-bookworm
    command: ["postgres", "-c", "max_connections=1500"]
    shm_size: "1gb"
    labels:
      io.pilotswarm.devcontainer: "source"
    environment:
      POSTGRES_USER: pilotswarm
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: pilotswarm_portal
    volumes:
      - portal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotswarm -d pilotswarm_portal"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  npm-cache:
  nx-cache:
  vscode-profile:
  local-workspaces:
  test-data:
  portal-data:
