name: PR checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  devcontainer:
    name: Source devcontainer and Nx checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start source workspace
        run: npx --no-install nx run devcontainer:up --skip-nx-cache
      - name: Check container prerequisites
        run: npx --no-install nx run devcontainer:doctor --skip-nx-cache
      - name: Run credential-free verification
        run: npx --no-install nx run devcontainer:test --skip-nx-cache
      - name: Run browser E2E
        run: npx --no-install nx run devcontainer:exec -- node node_modules/nx/dist/bin/nx.js run app:test-e2e --skip-nx-cache
      - name: Stop only this workspace
        if: always()
        run: npx --no-install nx run devcontainer:down -- --volumes

  sdk-unit-windows:
    name: Repository build and SDK unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install public model catalog for unit tests
        shell: pwsh
        run: Copy-Item .model_providers.example.json .model_providers.json
      - shell: bash
        run: npm run test:unit --workspace=pilotswarm-sdk
      - name: Validation campaign unit tests
        run: |
          npm run test:campaign:unit
          npm run test:campaign:dashboard:unit

  basic:
    name: Repository policy, build, and unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check repository privacy
        run: node scripts/check-repository-privacy.mjs
      - run: npm ci
      - run: npm run build
      - name: Deployment and CI policy tests
        run: |
          npm run test:deploy-scripts
          node --test .github/scripts/test/*.test.mjs .github/scripts/integration/*.test.mjs
      - name: Install public model catalog for unit tests
        run: cp .model_providers.example.json .model_providers.json
      - name: SDK API and unit tests
        run: |
          npm run test:api --workspace=pilotswarm-sdk
          npm run test:unit --workspace=pilotswarm-sdk
      - name: Validation campaign unit tests
        run: |
          npm run test:campaign:unit
          npm run test:campaign:dashboard:unit
      - name: Application unit tests
        run: npm test --workspace=pilotswarm
